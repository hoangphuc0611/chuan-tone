name: chuantone_media
description: "Phần native của ChuẩnTone (M7): chia sẻ / lưu file, dựng và ghép video 9:16 bằng API của hệ điều hành."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ChuanToneMediaPlugin
