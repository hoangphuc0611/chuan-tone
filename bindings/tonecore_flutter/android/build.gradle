// Gradle build engine ToneCore bằng NDK + CMake, đóng gói libtonecore.so vào APK.

group = "vn.chuantone.tonecore_flutter"
version = "0.2.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.1.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "vn.chuantone.tonecore_flutter"
    compileSdk = 36

    // NDK do app khai báo (app/android/app/build.gradle.kts).
    ndkVersion = android.ndkVersion

    // Oboe phát hành dạng prefab trong AAR → CMake tìm bằng find_package(oboe CONFIG).
    buildFeatures {
        prefab = true
    }

    externalNativeBuild {
        cmake {
            // Dùng thẳng CMakeLists của engine – không sao chép mã nguồn.
            path = "../../../engine/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 28 // Android 9

        externalNativeBuild {
            cmake {
                targets "tonecore"
                // c++_shared: bắt buộc khi dùng Oboe dạng prefab (Oboe là thư viện động).
                arguments "-DANDROID_STL=c++_shared", "-DTC_BUILD_TESTS=OFF"
            }
        }
    }
}

dependencies {
    implementation("com.google.oboe:oboe:1.11.0") // Apache-2.0
}
