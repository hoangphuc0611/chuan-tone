name: tonecore_flutter
description: "Binding Dart FFI cho ToneCore – engine âm thanh của ChuẩnTone."
version: 0.4.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
        package: vn.chuantone.tonecore_flutter
        pluginClass: ToneCoreFlutterPlugin
      ios:
        ffiPlugin: true
