# Build file IPA iOS CHƯA KÝ để cài lên iPhone bằng Sideloadly (Apple ID miễn phí, 7 ngày)
# khi máy dev chưa có Xcode. Tải ở tab Actions → ios-ipa → Artifacts → ChuanTone-ipa.
name: ios-ipa

on:
  workflow_dispatch: # chạy tay: Actions → ios-ipa → Run workflow
  push:
    branches: [main]
    paths: ["engine/**", "bindings/**", "app/**", ".fvmrc", ".github/workflows/ios-ipa.yml"]

jobs:
  ipa:
    # macos-26: có Xcode 26 (iOS SDK mới mà device_info_plus 13 cần; macos-15 chỉ có Xcode 16.4).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Đọc phiên bản Flutter từ .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ steps.fvm.outputs.version }}", cache: true }

      - name: Thông tin Xcode
        run: xcodebuild -version

      - name: Build tonecore.xcframework (engine C++ cho iPhone + Simulator)
        run: engine/scripts/build_xcframework.sh

      - name: Build app iOS release (không ký)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Đóng gói IPA
        run: |
          set -euo pipefail
          APP_DIR=app/build/ios/iphoneos
          test -d "$APP_DIR/Runner.app"
          # Kiểm tra engine đã được nhúng vào app
          test -f "$APP_DIR/Runner.app/Frameworks/tonecore.framework/tonecore"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP_DIR/Runner.app" ipa/Payload/
          (cd ipa && zip -qry ../ChuanTone.ipa Payload)
          ls -la ChuanTone.ipa

      # M9 B6: kích thước app (chỉ tiêu mục 7: ≤ 80 MB). App Store nén lại theo từng máy nên số tải
      # về thật nằm giữa cỡ IPA và cỡ đã giải nén.
      - name: Kích thước app
        run: |
          set -euo pipefail
          IPA=$(stat -f %z ChuanTone.ipa)
          APP=$(du -sk ipa/Payload/Runner.app | cut -f1)
          {
            echo "### Kích thước bản iOS"
            echo "| | MB |"
            echo "|---|---|"
            echo "| IPA (nén) | $(echo "scale=1; $IPA/1048576" | bc) |"
            echo "| Runner.app (giải nén) | $(echo "scale=1; $APP/1024" | bc) |"
            echo "| Chỉ tiêu (mục 7) | 80 |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$APP" -le $((80 * 1024)) || { echo "Vượt 80 MB"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ChuanTone-ipa
          path: ChuanTone.ipa
          retention-days: 14
