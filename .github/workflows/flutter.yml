name: flutter

on:
  push:
    paths: ["engine/**", "bindings/**", "app/**", ".fvmrc", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["engine/**", "bindings/**", "app/**", ".fvmrc", ".github/workflows/flutter.yml"]

jobs:
  dart:
    name: binding FFI + analyze
    runs-on: ubuntu-24.04
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@v4
      - name: Đọc phiên bản Flutter từ .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ steps.fvm.outputs.version }}", cache: true }
      - name: Build thư viện engine cho máy host
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cd engine && cmake --preset host -DTC_BUILD_TESTS=OFF && cmake --build --preset host --target tonecore
      - name: Test binding
        working-directory: bindings/tonecore_flutter
        run: |
          flutter pub get
          flutter analyze
          TONECORE_LIB=$GITHUB_WORKSPACE/engine/build/host/libtonecore.so flutter test
      - name: Analyze + test app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  android:
    name: build APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ steps.fvm.outputs.version }}", cache: true }
      - name: Build APK debug (Gradle tự build engine bằng NDK + CMake)
        working-directory: app
        run: flutter build apk --debug
      - name: Kiểm tra libtonecore.so có trong APK
        run: |
          unzip -l app/build/app/outputs/flutter-apk/app-debug.apk | grep -E "lib/arm64-v8a/libtonecore.so"
          unzip -l app/build/app/outputs/flutter-apk/app-debug.apk | grep -E "lib/arm64-v8a/liboboe.so"
      - uses: actions/upload-artifact@v4
        with: { name: chuantone-debug-apk, path: app/build/app/outputs/flutter-apk/app-debug.apk }

  ios:
    name: build iOS simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ steps.fvm.outputs.version }}", cache: true }
      - name: Build tonecore.xcframework
        run: engine/scripts/build_xcframework.sh
      - name: Build app cho simulator
        working-directory: app
        run: flutter build ios --simulator --debug
