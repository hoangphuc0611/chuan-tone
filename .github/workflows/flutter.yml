name: flutter

on:
  workflow_dispatch:
  push:
    paths: ["engine/**", "bindings/**", "app/**", ".fvmrc", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["engine/**", "bindings/**", "app/**", ".fvmrc", ".github/workflows/flutter.yml"]

jobs:
  dart:
    name: binding FFI + analyze
    runs-on: ubuntu-24.04
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@v4
      - name: Đọc phiên bản Flutter từ .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ steps.fvm.outputs.version }}", cache: true }
      - name: Build thư viện engine cho máy host
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cd engine && cmake --preset host -DTC_BUILD_TESTS=OFF && cmake --build --preset host --target tonecore
      - name: Test binding
        working-directory: bindings/tonecore_flutter
        run: |
          flutter pub get
          flutter analyze
          TONECORE_LIB=$GITHUB_WORKSPACE/engine/build/host/libtonecore.so flutter test
      - name: Analyze + test app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          TONECORE_LIB=$GITHUB_WORKSPACE/engine/build/host/libtonecore.so flutter test
      # M9 B6: license mọi gói Dart (MIT / BSD / Apache-2.0 / Zlib / ISC, ngoại lệ ghi ở docs/licenses.md).
      - name: Kiểm license gói Dart
        run: |
          python3 -m unittest discover -v tools/licenses/tests
          python3 tools/licenses/check_dart_licenses.py

  android:
    name: build APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ steps.fvm.outputs.version }}", cache: true }
      - name: Build APK debug (Gradle tự build engine bằng NDK + CMake)
        working-directory: app
        run: |
          flutter build apk --debug --build-number=${{ github.run_number }} \
            --dart-define=CHUANTONE_COMMIT=${GITHUB_SHA::7}
      - name: Kiểm tra libtonecore.so có trong APK
        run: |
          unzip -l app/build/app/outputs/flutter-apk/app-debug.apk | grep -E "lib/arm64-v8a/libtonecore.so"
          unzip -l app/build/app/outputs/flutter-apk/app-debug.apk | grep -E "lib/arm64-v8a/liboboe.so"
      # M9 B6: cỡ bản release arm64 (bản debug có thêm mã gỡ lỗi Dart, to hơn nhiều — không dùng để so).
      - name: Kích thước APK release (arm64)
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-number=${{ github.run_number }} --dart-define=CHUANTONE_COMMIT=${GITHUB_SHA::7}
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          SIZE=$(stat -c %s "$APK")
          {
            echo "### Kích thước bản Android"
            echo "| | MB |"
            echo "|---|---|"
            echo "| APK release arm64-v8a | $(echo "scale=1; $SIZE/1048576" | bc) |"
            echo "| Chỉ tiêu (mục 7) | 80 |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -le $((80 * 1048576)) || { echo "Vượt 80 MB"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: chuantone-debug-apk, path: app/build/app/outputs/flutter-apk/app-debug.apk }

  # Build iOS: xem workflow ios-ipa.yml (tránh chạy trùng máy macOS – tốn phút CI).
