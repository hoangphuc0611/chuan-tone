name: engine

on:
  workflow_dispatch:
  push:
    paths: ["engine/**", "tools/pitch/**", "tools/keytest/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "tools/pitch/**", "tools/keytest/**", ".github/workflows/engine.yml"]

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: host }
          - { os: ubuntu-24.04, preset: host-asan }
          - { os: ubuntu-24.04, preset: host-ubsan }
          - { os: ubuntu-24.04, preset: host-tsan }
          - { os: macos-15, preset: host }
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Cài Ninja
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build; else brew install ninja; fi
      - name: Sửa entropy ASLR cho ThreadSanitizer (Ubuntu 24.04)
        if: matrix.preset == 'host-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        working-directory: engine
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        working-directory: engine
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        working-directory: engine
        run: ctest --preset ${{ matrix.preset }}

  bench:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - working-directory: engine
        run: |
          cmake --preset host-release
          cmake --build --preset host-release
          ./build/host-release/bench/tonecore_bench --benchmark_min_time=0.1s --benchmark_format=console | tee bench.txt
      - uses: actions/upload-artifact@v4
        with: { name: bench-linux, path: engine/bench.txt }

  # Chấm điểm dò cao độ trên vocadito (CC BY 4.0, 58 MB, cache theo SHA-256 trong script).
  pitch-eval:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: testdata
          key: testdata-${{ hashFiles('tools/pitch/fetch_datasets.sh') }}
      - name: Tải vocadito
        run: tools/pitch/fetch_datasets.sh
      - name: Build pitchlab (Release)
        working-directory: engine
        run: |
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DTC_BUILD_TESTS=OFF
          cmake --build build/rel --target pitchlab
      - name: Chấm điểm (RPA ≥ 0,90)
        run: python3 tools/pitch/eval_f0.py --pitchlab engine/build/rel/tools/pitchlab --min-rpa 0.90 | tee pitch-eval.md
      - uses: actions/upload-artifact@v4
        with: { name: pitch-eval, path: pitch-eval.md }

  # Công cụ chấm điểm dò tone (M3): test Python, kiểm chéo với mir_eval, chạy keylab thật.
  # Bộ bài Việt có bản quyền không đưa lên CI — chỉ chạy trên máy dev (tools/keytest/README.md).
  keytest:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cài mir_eval (MIT, chỉ để kiểm chéo)
        run: pip install mir_eval==0.8.2
      - name: Build keylab (Release)
        working-directory: engine
        run: |
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DTC_BUILD_TESTS=OFF
          cmake --build build/rel --target keylab
      - name: Test keytest
        run: KEYLAB=engine/build/rel/tools/keylab python -m unittest discover -v tools/keytest/tests
      - name: Test tools/stretch (trang nghe A/B, beatlab giả)
        run: python -m unittest discover -v tools/stretch/tests
      - name: Kiểm tra CSV mẫu
        run: python tools/keytest/validate_csv.py tools/keytest/example.csv --no-check-files

  # Chấm dò tone trên GuitarSet (CC BY 4.0, ~700 MB, cache theo MD5 trong script) để chặn hồi quy
  # cả chuỗi phân tích trên dữ liệu công khai. Ghim profile temperley-kp: profile mặc định
  # "vn-karaoke" học riêng cho nhạc Việt (GuitarSet 0,642). Không phải chỉ tiêu M3 (chỉ tiêu tính
  # trên bộ bài Việt, chỉ chạy trên máy dev).
  key-eval:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: testdata/GuitarSet
          key: guitarset-${{ hashFiles('tools/keytest/fetch_guitarset.sh') }}
      - name: Tải GuitarSet
        run: tools/keytest/fetch_guitarset.sh
      - name: Build keylab (Release)
        working-directory: engine
        run: |
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DTC_BUILD_TESTS=OFF
          cmake --build build/rel --target keylab
      - name: Chấm điểm (MIREX ≥ 0.68)
        run: python3 tools/keytest/keytest.py run --csv testdata/GuitarSet/guitarset.csv --min-score 0.68 --out key-eval.md -- --profile temperley-kp
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: key-eval, path: key-eval.md }

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cài clang-format đúng bản dùng trên máy dev (23.1.3)
        run: pip install --user clang-format==23.1.3
      - name: clang-format
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          clang-format --version
          find engine/src engine/include engine/tests engine/bench engine/tools -name '*.h' -o -name '*.cpp' -o -name '*.c' \
            | xargs clang-format --dry-run --Werror
