name: server

on:
  workflow_dispatch:
  push:
    paths: ["server/**", "engine/src/codec/**", "engine/src/decode/**", "engine/tools/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "engine/src/codec/**", "engine/src/decode/**", "engine/tools/**", ".github/workflows/server.yml"]

jobs:
  pytest:
    name: pytest (bộ tách giả)
    runs-on: ubuntu-24.04
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build tcflac (nén / giải mã FLAC của engine)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cd engine && cmake --preset host -DTC_BUILD_TESTS=OFF && cmake --build --preset host --target tcflac
      - name: pytest (không cài torch / htdemucs)
        working-directory: server
        env:
          CHUANTONE_TCFLAC: ${{ github.workspace }}/engine/build/host/tools/tcflac
        run: |
          uv sync --frozen
          uv run --frozen pytest -q
