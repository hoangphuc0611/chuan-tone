# Server tách vocal của ChuẩnTone (docs/m6-plan.md). Chạy: uv run chuantone-server
[project]
name = "chuantone-server"
version = "0.1.0"
description = "Tách giọng ca sĩ cho ChuẩnTone (FastAPI)."
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
# Bộ tách htdemucs — CHỈ PHÁT TRIỂN NỘI BỘ: trọng số "chỉ cho mục đích khoa học" (docs/m6-plan.md
# điểm 1). CI không cài nhóm này (dùng bộ tách giả).
demucs = [
  "torch>=2.5",
  "demucs==4.0.1",
  "openunmix==1.3.0",
  "einops>=0.8",
  "julius>=0.2.7",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

# Gói demucs khai báo cả lameenc (bọc LAME, LGPL), torchaudio / ffmpeg (đọc file), tqdm (MIT +
# MPL-2.0), dora-search (kéo submitit, omegaconf…) → ghi đè metadata để KHÔNG kéo phụ thuộc nào;
# phụ thuộc thật khai báo ở nhóm "demucs". Ba mô-đun demucs import nhưng không dùng khi tách (tqdm,
# dora.log, omegaconf) thay bằng mô-đun rỗng trong src/chuantone_server/_stubs. openunmix: chỉ dùng
# openunmix.filtering.wiener (chỉ cần torch) → cũng không kéo phụ thuộc.
[[tool.uv.dependency-metadata]]
name = "demucs"
version = "4.0.1"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "openunmix"
version = "1.3.0"
requires-dist = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chuantone_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
